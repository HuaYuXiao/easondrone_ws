name: build

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - {rosdistro: 'noetic', container: 'ros:noetic-ros-base-focal'}
    container: ${{ matrix.config.container }}
    
    steps:        
    - name: update git
      run: |
        apt update 
        apt install -y software-properties-common
        add-apt-repository ppa:git-core/ppa
        apt update
        apt install -y git

    - name: Clone repo with submodules
      run: |
        git clone --recursive https://github.com/${{ github.repository }} .
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        
    - name: Install catkin-tools on Noetic
      run: |
        apt-key adv --keyserver 'hkp://keyserver.ubuntu.com:80' --recv-key C1CF6E31E6BADE8868B172B4F42ED6FBAB17C654
        apt update
        apt install -y python3-pip
        pip3 install osrf-pycommon
        apt update
        apt install -y python3-wstool python3-catkin-tools
        
    - name: release_build_test
      working-directory: ${{ github.workspace }}
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt update
        apt install -y python3-wstool autoconf libtool
        catkin init
        catkin config --extend "/opt/ros/${{matrix.config.rosdistro}}"
        catkin config --merge-devel
        chmod +x scripts/install_*.sh
        ./scripts/install_gazebo.sh
        ./scripts/install_mavros.sh
        ./scripts/install_easondrone.sh
